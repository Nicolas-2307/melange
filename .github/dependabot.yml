version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Node types must match the runtime in .nvmrc (Node 24).
      - dependency-name: "@types/node"
        versions: [">=25"]
      # Major upgrades of core tooling are done manually, after reading the migration guide.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
      day: monday
      timezone: America/Bogota
    commit-message:
      prefix: ci
